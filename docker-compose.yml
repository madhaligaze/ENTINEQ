# Вся связка локально одной командой:  docker compose up --build
# Пять сервисов - ровно как в Railway (четыре репозитория + Postgres):
#
#   браузер ─▶ agent-frontend ─▶ agent-backend ─▶ db (PostgreSQL)
#   браузер ─▶ public-frontend ─▶ public-backend ─▶ agent-backend
#
#   ENTINEQ_AGENT (владелец и доверенные):  http://localhost:8080
#   ENTINEQ (публичное приложение):         http://localhost:8081
# Бэкенды наружу не публикуются - достучаться до них можно только через фронтенды (закрытый контур).
#
# По умолчанию вместо Claude отвечает заглушка (бесплатно). Для настоящего Claude создайте рядом файл .env:
#   AGENT_RUNNER=claude
#   ANTHROPIC_API_KEY=sk-ant-...
# Корневой docker-compose.yml нужен только для локальной проверки: в Railway каждый проект деплоится отдельно.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: entineq
      POSTGRES_PASSWORD: entineq
      POSTGRES_DB: entineq
    volumes:
      - entineq-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entineq"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent-backend:
    build: ./ENTINEQ_AGENT/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://entineq:entineq@db:5432/entineq
      INTERNAL_API_SECRET: local-dev-shared-secret-change-me-0123456789abcdef
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-owner-password-123}
      AGENT_RUNNER: ${AGENT_RUNNER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Адрес, который браузер видит у фронтенда (его присылает в заголовке Origin).
      ALLOWED_ORIGINS: http://localhost:8080
      # Локально открываем по http://localhost, поэтому cookie без флага Secure. В продакшене (https) этой строки нет.
      COOKIE_SECURE: "false"
    volumes:
      - entineq-agent-data:/data

  agent-frontend:
    build: ./ENTINEQ_AGENT/frontend
    depends_on:
      - agent-backend
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://agent-backend:8080
      TRUST_PROXY_HOPS: "0"

  public-backend:
    build: ./ENTINEQ/backend
    depends_on:
      - agent-backend
    environment:
      AGENT_BASE_URL: http://agent-backend:8080
      INTERNAL_API_SECRET: local-dev-shared-secret-change-me-0123456789abcdef
      ALLOWED_ORIGINS: http://localhost:8081
      COOKIE_SECURE: "false"

  public-frontend:
    build: ./ENTINEQ/frontend
    depends_on:
      - public-backend
    ports:
      - "8081:8080"
    environment:
      BACKEND_URL: http://public-backend:8080
      TRUST_PROXY_HOPS: "0"

volumes:
  entineq-db:
  entineq-agent-data:
