<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ENTINEQ_AGENT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236ea8fe'/%3E%3Cpath d='M9 9h14v3H13v3h8v3h-8v3h10v3H9z' fill='%23081326'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <main id="boot-view" class="center muted">Загрузка…</main>

  <main id="login-view" class="center" hidden>
    <form id="login-form" class="card" novalidate>
      <h1>ENTINEQ_AGENT</h1>
      <p class="muted">Вход для владельца и доверенных людей</p>
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required>
      <label for="login-password">Пароль</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button id="login-submit" type="submit" class="primary">Войти</button>
    </form>
  </main>

  <div id="app-view" class="app" hidden>
    <header class="topbar">
      <button id="sidebar-toggle" class="ghost only-narrow" type="button" aria-label="Диалоги" aria-expanded="false">☰</button>
      <strong class="brand">ENTINEQ_AGENT</strong>
      <nav class="tabs" aria-label="Разделы">
        <button id="tab-chat" class="tab active" type="button" aria-current="page">Чат</button>
        <button id="tab-admin" class="tab" type="button" hidden>Админка</button>
      </nav>
      <span class="spacer"></span>
      <span id="user-email" class="muted user-email"></span>
      <button id="logout" class="ghost" type="button">Выйти</button>
    </header>

    <div id="chat-screen" class="screen chat-screen">
      <aside id="sidebar" class="sidebar" aria-label="Диалоги">
        <button id="new-chat" class="primary" type="button">+ Новый диалог</button>
        <ul id="conversation-list" class="conversations"></ul>
        <section id="usage" class="usage" aria-label="Лимиты">
          <div class="usage-title">Лимит сессии <span id="usage-hours"></span></div>
          <div id="usage-bar" class="bar" hidden><div id="usage-bar-fill" class="bar-fill"></div></div>
          <div id="usage-window-line" class="usage-line"></div>
          <div id="usage-timer" class="usage-line"></div>
          <div id="usage-month-line" class="usage-line muted"></div>
        </section>
      </aside>

      <section class="chat" aria-label="Чат">
        <div id="messages" class="messages" aria-live="polite"></div>
        <div id="banner" class="banner" role="status" hidden></div>
        <form id="composer" class="composer">
          <textarea id="input" rows="2" maxlength="20000" placeholder="Напишите задачу агенту…" aria-label="Сообщение"></textarea>
          <button id="send" class="primary" type="submit">Отправить</button>
        </form>
        <div id="status" class="status muted">подключение…</div>
      </section>

      <aside class="terminal-panel" aria-label="Действия агента">
        <h2>Терминал · действия агента</h2>
        <div id="terminal" class="terminal"></div>
      </aside>
    </div>

    <div id="admin-screen" class="screen admin-screen" hidden>
      <div id="admin-root" class="admin"></div>
    </div>
  </div>
</body>
</html>
